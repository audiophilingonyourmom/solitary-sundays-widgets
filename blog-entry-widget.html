<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blog Entry Widget</title>
<style>
  /*
     Same font files as the main site. Every file in this project
     (blog.html, style.css, both widgets, admin.html) expects
     fonts and images sitting flat in the same root folder — if
     you move this widget into a subfolder later, update these
     url()s to match.
  */
  @font-face {
    font-family: "GothicPixels";
    src: url("GothicPixels.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: "Awesome";
    src: url("Awesome.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: "ZaiPencilTypewriter";
    src: url("zai_PencilTypewriter.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "ZaiPencilTypewriter", Georgia, serif;
    color: #2c1a18;
    background: transparent;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /*
     Widget-only controls (search/category/tag) — these have no
     equivalent in the real site's CSS since they don't exist
     outside this widget, so they're styled to fit the palette
     rather than matching an existing class.
  */
  .entry-controls {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  #search-input {
    flex: 1;
    min-width: 120px;
    padding: 5px 8px;
    font-family: inherit;
    font-size: 12px;
    border: 1px solid rgba(122, 21, 24, 0.35);
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.5);
    color: #2c1a18;
  }
  .category-btn {
    background: rgba(122, 21, 24, 0.08);
    border: 1px solid rgba(122, 21, 24, 0.35);
    border-radius: 3px;
    color: #7a1518;
    font-family: "GothicPixels", monospace;
    font-size: 10px;
    padding: 4px 8px;
    cursor: pointer;
  }
  .category-btn.active { background: #7a1518; color: #fff; border-color: #7a1518; }
  .active-tag-chip {
    background: #7a1518;
    color: #fff;
    border: none;
    border-radius: 3px;
    font-family: "GothicPixels", monospace;
    font-size: 10px;
    padding: 4px 8px;
    cursor: pointer;
  }

  /*
     entry-container is now the scrollable region — it takes up
     whatever space is left under entry-controls (which stays put
     at a fixed height) and scrolls its own content internally,
     instead of the whole document growing to fit a long post.
  */
  #entry-container {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
  }

  #entry-container::-webkit-scrollbar {
    width: 6px;
  }
  #entry-container::-webkit-scrollbar-track {
    background: rgba(80, 40, 30, 0.06);
  }
  #entry-container::-webkit-scrollbar-thumb {
    background: rgba(100, 50, 40, 0.35);
    border-radius: 10px;
  }

  /*
     Everything below reuses the real site's exact class names,
     fonts, sizes, and colors from style.css's .post-header /
     .post-date / .post-title / .post-gif / .post-divider /
     .post-tags / .post-navigation rules. The surrounding box
     (background, border, backdrop-blur, padding) is deliberately
     NOT duplicated here — that's already supplied by the real
     .post-body element this widget's iframe sits inside on the
     live page, so re-adding it here would double it up.
  */

  .post-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .post-date {
    font-family: "GothicPixels", monospace;
    font-size: 11px;
    font-weight: normal;
    color: #2c1a18;
  }

  .post-gif {
    width: 16px;
    height: 16px;
    object-fit: contain;
    margin: 0 6px;
  }

  .post-title {
    font-family: "Awesome", serif;
    font-size: 18px;
    font-weight: normal;
    color: #2c1a18;
    text-align: right;
  }

  .post-divider {
    border: none;
    border-top: 1px dashed #7a1518;
    margin: 8px 0 12px 0;
  }

  .post-body-text {
    font-family: "ZaiPencilTypewriter", monospace;
    font-size: 14px;
    line-height: 1.6;
    color: #2c1a18;
    white-space: pre-wrap;
    margin-bottom: 12px;
  }

  .post-image {
    display: block;
    max-width: 90%;
    height: auto;
    margin: 16px auto;
    border: 4px solid rgba(122, 21, 24, 0.15);
    box-shadow: 3px 4px 8px rgba(50, 20, 15, 0.18);
  }

  .post-category {
    display: inline-block;
    font-family: "GothicPixels", monospace;
    font-size: 10px;
    color: #7a1518;
    border: 1px solid rgba(122, 21, 24, 0.25);
    border-radius: 3px;
    padding: 2px 6px;
    margin-bottom: 8px;
  }

  .post-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .post-tags span, .post-tags button {
    background: rgba(122, 21, 24, 0.1);
    border: 1px solid rgba(122, 21, 24, 0.25);
    border-radius: 3px;
    color: #7a1518;
    font-family: "GothicPixels", monospace;
    font-size: 10px;
    padding: 3px 8px;
    cursor: pointer;
  }
  .post-tags button:hover { background: #7a1518; color: #fff; }

  .post-navigation {
    display: flex;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid rgba(122, 21, 24, 0.25);
  }
  .post-navigation a, .post-navigation button {
    background: none;
    border: none;
    color: #7a1518;
    font-family: "GothicPixels", monospace;
    font-size: 10px;
    cursor: pointer;
    text-decoration: none;
    padding: 0;
  }
  .post-navigation button:hover { text-decoration: underline; }
  .post-navigation button:disabled {
    color: rgba(122, 21, 24, 0.35);
    cursor: default;
    text-decoration: none;
  }

  .entry-empty {
    font-family: "ZaiPencilTypewriter", monospace;
    font-size: 13px;
    color: #7a1518;
  }
</style>
</head>
<body>
  <div class="entry-controls">
    <input type="text" id="search-input" placeholder="Search posts...">
    <button class="category-btn active" data-category="">All</button>
    <button class="category-btn" data-category="Life Updates">Life Updates</button>
    <button class="category-btn" data-category="Thoughts and Things">Thoughts</button>
    <button class="category-btn" data-category="Reviews">Reviews</button>
    <button class="active-tag-chip" id="active-tag-chip" style="display:none;"></button>
  </div>

  <div id="entry-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ---- Fill these in with your Supabase project's values ----
    const SUPABASE_URL = "https://gcnmjgyuyelqppkpytow.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_6SJRQVPqERtYanyHi7iGxw_NGIwVoWN";
    // -------------------------------------------------------------

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allPosts = [];
    let currentIndex = 0; // index within the FILTERED list
    let activeCategory = "";
    let activeTag = "";
    let searchText = "";

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // Parses ONLY the specific token ![alt](https://...) out of the
    // post body and turns it into a real <img class="post-image">.
    // Everything else is escaped as plain text — this is not a full
    // markdown parser and deliberately doesn't support any other
    // HTML, so a post body can never inject arbitrary markup, only
    // images inserted through the admin panel's Insert Image button.
    function renderBody(text) {
      const imageToken = /!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g;
      let html = "";
      let lastIndex = 0;
      let match;

      while ((match = imageToken.exec(text)) !== null) {
        const [full, alt, url] = match;
        html += escapeHtml(text.slice(lastIndex, match.index));
        html += `<img class="post-image" src="${escapeHtml(url)}" alt="${escapeHtml(alt)}">`;
        lastIndex = match.index + full.length;
      }

      html += escapeHtml(text.slice(lastIndex));
      return html;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
    }

    function getFiltered() {
      return allPosts.filter(post => {
        if (activeCategory && post.category !== activeCategory) return false;
        if (activeTag && !(post.tags || []).includes(activeTag)) return false;
        if (searchText) {
          const haystack = (post.title + " " + post.body + " " + (post.tags || []).join(" ")).toLowerCase();
          if (!haystack.includes(searchText.toLowerCase())) return false;
        }
        return true;
      });
    }

    function render() {
      document.querySelectorAll(".category-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.category === activeCategory);
      });

      const tagChip = document.getElementById("active-tag-chip");
      if (activeTag) {
        tagChip.style.display = "inline-block";
        tagChip.textContent = "#" + activeTag + " ✕";
        tagChip.onclick = () => { activeTag = ""; currentIndex = 0; render(); };
      } else {
        tagChip.style.display = "none";
      }

      const filtered = getFiltered();
      const container = document.getElementById("entry-container");

      if (filtered.length === 0) {
        container.innerHTML = '<p class="entry-empty">No posts match.</p>';
        return;
      }

      if (currentIndex >= filtered.length) currentIndex = filtered.length - 1;
      if (currentIndex < 0) currentIndex = 0;

      const post = filtered[currentIndex];
      // "Older" = further back in time = higher index (list is newest-first)
      const hasOlder = currentIndex < filtered.length - 1;
      const hasNewer = currentIndex > 0;

      container.innerHTML = `
        <header class="post-header">
          <span class="post-date">${formatDate(post.created_at)}</span>
          <span class="post-title">${escapeHtml(post.title)}</span>
        </header>
        <div class="post-category">${escapeHtml(post.category)}</div>
        <hr class="post-divider">
        <div class="post-body-text">${renderBody(post.body)}</div>
        <div class="post-tags">
          ${(post.tags || []).map(t => `<button data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</button>`).join("")}
        </div>
        <div class="post-navigation">
          <button id="older-btn" ${hasOlder ? "" : "disabled"}>← Older Entry</button>
          <button id="newer-btn" ${hasNewer ? "" : "disabled"}>Newer Entry →</button>
        </div>
      `;

      container.querySelectorAll(".post-tags button").forEach(btn => {
        btn.addEventListener("click", () => {
          activeTag = btn.dataset.tag;
          currentIndex = 0;
          render();
        });
      });

      const olderBtn = document.getElementById("older-btn");
      const newerBtn = document.getElementById("newer-btn");
      if (hasOlder) olderBtn.addEventListener("click", () => { currentIndex++; render(); });
      if (hasNewer) newerBtn.addEventListener("click", () => { currentIndex--; render(); });
    }

    async function loadPosts() {
      const { data, error } = await supabaseClient
        .from("blog_posts")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Supabase error:", error);
        document.getElementById("entry-container").innerHTML = '<p class="entry-empty">Couldn\'t load posts right now.</p>';
        return;
      }

      allPosts = data || [];
      render();
    }

    document.querySelectorAll(".category-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.category;
        currentIndex = 0;
        render();
      });
    });

    document.getElementById("search-input").addEventListener("input", (e) => {
      searchText = e.target.value;
      currentIndex = 0;
      render();
    });

    // Lets the recent-posts sidebar widget (a separate iframe) tell
    // this widget to jump straight to a specific post by id.
    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "blog-show-post") return;
      const idx = allPosts.findIndex(p => p.id === event.data.id);
      if (idx === -1) return;
      // Reset filters so the requested post is guaranteed visible
      activeCategory = "";
      activeTag = "";
      searchText = "";
      document.getElementById("search-input").value = "";
      const filtered = getFiltered();
      currentIndex = filtered.findIndex(p => p.id === event.data.id);
      render();
    });

    loadPosts();
  </script>
</body>
</html>
