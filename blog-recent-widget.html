<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Recent Posts Widget</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    color: #3a2e28;
    background: transparent;
    overflow: hidden;
  }
  .recent-heading {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
    color: #5c4a3d;
  }

  .recent-item {
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    margin-bottom: 8px;
    border: 1px solid rgba(184, 169, 152, 0.4);
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
  }
  .recent-item:last-child { margin-bottom: 0; }

  .recent-item::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 253, 247, 0.55);
    z-index: 0;
  }

  .recent-item-title,
  .recent-item-date {
    position: relative;
    z-index: 1;
  }

  .recent-item-title { display: block; font-size: 13px; color: #3a2e28; }
  .recent-item-date { display: block; font-size: 10px; color: #7a6a5c; font-style: italic; }
  .recent-empty { font-size: 12px; color: #7a6a5c; }

  /*
     Search + category filter controls — moved here from
     blog-entry-widget.html so that widget's iframe can devote its
     full height to the post itself. Interacting with these sends
     a postMessage sideways to #blog-entry-frame (a sibling iframe
     in the parent page), same cross-widget technique goToPost()
     below already uses.
  */
  .filter-section {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid #b8a998;
  }

  #search-input {
    width: 100%;
    padding: 6px 8px;
    margin-bottom: 8px;
    font-family: inherit;
    font-size: 12px;
    border: 1px solid rgba(122, 21, 24, 0.3);
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.6);
    color: #3a2e28;
  }

  .category-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .category-btn {
    position: relative;
    background-image: url("btn-bg.png");
    background-size: cover;
    background-position: center;
    border: 1px solid rgba(122, 21, 24, 0.35);
    border-radius: 3px;
    color: #5c1414;
    font-family: inherit;
    font-size: 10px;
    font-weight: bold;
    padding: 5px 9px;
    cursor: pointer;
    overflow: hidden;
  }

  .category-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 253, 247, 0.55);
    z-index: 0;
  }

  .category-btn.active::before {
    background: rgba(122, 21, 24, 0.75);
  }

  .category-btn span {
    position: relative;
    z-index: 1;
  }

  .category-btn.active span {
    color: #fff;
  }
</style>
</head>
<body>
  <div class="recent-heading">Recent Entries</div>
  <div id="recent-list"></div>

  <div class="filter-section">
    <input type="text" id="search-input" placeholder="Search posts...">
    <div class="category-buttons">
      <button class="category-btn active" data-category=""><span>All</span></button>
      <button class="category-btn" data-category="Life Updates"><span>Life Updates</span></button>
      <button class="category-btn" data-category="Thoughts and Things"><span>Thoughts</span></button>
      <button class="category-btn" data-category="Reviews"><span>Reviews</span></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ---- Fill these in with your Supabase project's values ----
    const SUPABASE_URL = "https://gcnmjgyuyelqppkpytow.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_6SJRQVPqERtYanyHi7iGxw_NGIwVoWN";
    // -------------------------------------------------------------
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CARD_BACKGROUNDS = ["deco1.png", "deco2.png", "deco3.png"];

    // Same convention as blog-entry-widget.html — category pages
    // pass ?category=... on this widget's iframe src too, so the
    // sidebar's recent-posts list and active button match whatever
    // category the page is actually showing.
    const urlParams = new URLSearchParams(window.location.search);
    const pageCategory = urlParams.get("category") || "";

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
    function sendHeight() {
      const height = document.documentElement.scrollHeight;
      window.parent.postMessage({ type: "solitary-widget-resize", widget: "blog-recent", height }, "*");
    }
    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    }

    // Shared helper — every message this widget sends to its
    // sibling goes through the same lookup.
    function sendToEntryWidget(message) {
      // Can't reach a sibling iframe directly cross-origin — see
      // script.js's WIDGET BRIDGE comment for why. This posts UP
      // to the parent Neocities page instead, asking it to relay
      // the payload sideways to #blog-entry-frame.
      window.parent.postMessage({ type: "blog-relay", target: "blog-entry", payload: message }, "*");
    }

    function goToPost(id) {
      sendToEntryWidget({ type: "blog-show-post", id });
    }

    async function loadRecent() {
      let query = supabaseClient
        .from("blog_posts")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(3);

      if (pageCategory) {
        query = query.eq("category", pageCategory);
      }

      const { data, error } = await query;
      const container = document.getElementById("recent-list");
      if (error || !data || data.length === 0) {
        container.innerHTML = '<p class="recent-empty">No posts yet.</p>';
        sendHeight();
        return;
      }
      container.innerHTML = data.map((post, i) => `
        <button
          class="recent-item"
          data-id="${post.id}"
          style="background-image:url('${CARD_BACKGROUNDS[i % CARD_BACKGROUNDS.length]}');"
        >
          <span class="recent-item-title">${escapeHtml(post.title)}</span>
          <span class="recent-item-date">${formatDate(post.created_at)}</span>
        </button>
      `).join("");
      container.querySelectorAll(".recent-item").forEach(btn => {
        btn.addEventListener("click", () => goToPost(Number(btn.dataset.id)));
      });
      sendHeight();
    }

    // Search box — sends the current text over on every keystroke
    document.getElementById("search-input").addEventListener("input", (e) => {
      sendToEntryWidget({ type: "blog-set-search", searchText: e.target.value });
    });

    // Category buttons — toggle active state locally for visual
    // feedback, and tell the entry widget which category to show
    document.querySelectorAll(".category-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.category === pageCategory);
      btn.addEventListener("click", () => {
        document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        sendToEntryWidget({ type: "blog-set-category", category: btn.dataset.category });
      });
    });

    loadRecent();
    window.addEventListener("resize", sendHeight);
  </script>
</body>
</html>
