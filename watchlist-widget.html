<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Watchlist</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #bb86fc;
      --border-color: #333;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      margin: 0;
    }

    .page-title {
      text-align: center;
      font-family: "Caveat", cursive;
      font-size: 3rem;
      margin: 10px 0 20px;
      color: #ffffff;
    }

    .view-toggle {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .view-toggle button {
      background: #1a1a1a;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .view-toggle button.active {
      background: var(--accent-color);
      color: #121212;
      border-color: var(--accent-color);
    }

    .demo-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 1000px;
      margin: 20px auto 30px;
      padding: 15px;
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      position: sticky;
      top: 10px;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .demo-nav a {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 4px;
      background: #252525;
      transition: background 0.2s, color 0.2s;
    }
    .demo-nav a:hover { background: var(--accent-color); color: #121212; }

    .demo-section {
      max-width: 1100px;
      margin: 0 auto 60px;
    }
    .demo-title {
      font-size: 1.8rem;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .genre-subsection { margin-bottom: 30px; }
    .genre-subtitle {
      font-size: 1.1rem;
      color: var(--accent-color);
      margin-bottom: 12px;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px;
    }
    .media-grid.fixed-six {
      grid-template-columns: repeat(6, 1fr);
      max-width: 1100px;
      margin: 0 auto;
    }
    @media (max-width: 900px) { .media-grid.fixed-six { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 500px) { .media-grid.fixed-six { grid-template-columns: repeat(2, 1fr); } }

    .media-card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease;
    }
    .media-card:hover { transform: translateY(-4px); }

    .cover-wrap {
      width: 100%;
      aspect-ratio: 2 / 3;
      background-color: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .media-card img { width: 100%; height: 100%; object-fit: cover; }

    .media-title {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 8px;
      text-align: center;
      margin: 0;
      line-height: 1.2;
    }

    .skeleton {
      background: linear-gradient(90deg, #2a2a2a 25%, #3a3a3a 50%, #2a2a2a 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .classify-progress {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 20px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  </div>

  <div id="allView">
    <div class="media-grid fixed-six" id="allGrid"></div>
  </div>

  <!-- DEMOGRAPHIC/GENRE VIEW: built dynamically from live classification -->

    <p class="classify-progress" id="classifyProgress"></p>
    <div class="demo-nav" id="demoNav"></div>
    <div id="demoContainer"></div>
  </div>

const delay = ms => new Promise(res => setTimeout(res, ms));

function sendHeight() {
  const height = document.documentElement.scrollHeight;
  window.parent.postMessage({ type: "solitary-widget-resize", widget: "watchlist", height }, "*");
}

// ---------------- Mapping Rules ----------------
const GENRE_MAP = {
  "Action": "Action", "Romance": "Romance", "Comedy": "Comedy",
  "Drama": "Drama", "Horror": "Horror", "Suspense": "Thriller",
  "Sci-Fi": "Sci-Fi/Supernatural/Fantasy", "Supernatural": "Sci-Fi/Supernatural/Fantasy",
  "Fantasy": "Sci-Fi/Supernatural/Fantasy", "Slice of Life": "Slice of Life",
  "Adventure": "Adventure", "Mystery": "Mystery", "Ecchi": "Ecchi",
  "Mecha": "Mecha", "Music": "Music", "Psychological": "Psychological",
  "Iyashikei": "Iyashikei", "Mahou Shoujo": "Magical Girl"
};

const DEMOGRAPHIC_MAP = {
  "Shounen": "Shounen", "Shoujo": "Shoujo",
  "Seinen": "Seinen", "Josei": "Josei", "Kids": "Kodomomuke"
};

// ---------------- Robust Fetching with Kitsu Fallback ----------------
async function fetchAnimeData(title, retries = 3) {
  const cleanTitle = encodeURIComponent(title.trim());

  // 1. Try Jikan API (MyAnimeList)
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await fetch(`https://api.jikan.moe/v4/anime?q=${cleanTitle}&limit=1&sfw=true`);
      
      if (res.status === 429 || res.status === 504) {
        // Gateway Timeout (504) or Rate-limit (429) -> Wait longer each time
        const waitTime = 1500 * (attempt + 1) + Math.random() * 500;
        console.warn(`Jikan API returned ${res.status} for "${title}". Retrying in ${Math.round(waitTime)}ms...`);
        await delay(waitTime);
        continue;
      }

      if (res.ok) {
        const data = await res.json();
        if (data.data && data.data.length > 0) {
          return {
            title: title,
            imageUrl: data.data[0].images?.jpg?.image_url,
            raw: data.data[0]
          };
        }
      }
    } catch (err) {
      console.error(`Attempt ${attempt + 1} failed for "${title}":`, err);
      await delay(1500 * (attempt + 1));
    }
  }

  // 2. Fallback to Kitsu API if Jikan fails/times out repeatedly
  console.warn(`Jikan API failed for "${title}". Trying Kitsu API fallback...`);
  try {
    const kitsuRes = await fetch(`https://kitsu.io/api/edge/anime?filter[text]=${cleanTitle}&page[limit]=1`);
    if (kitsuRes.ok) {
      const kitsuData = await kitsuRes.json();
      if (kitsuData.data && kitsuData.data.length > 0) {
        const item = kitsuData.data[0].attributes;
        return {
          title: title,
          imageUrl: item.posterImage?.small || item.posterImage?.original,
          raw: {
            demographics: [],
            genres: [{ name: item.subtype || "Other" }],
            explicit_genres: [],
            themes: []
          }
        };
      }
    }
  } catch (kitsuErr) {
    console.error(`Kitsu fallback failed for "${title}":`, kitsuErr);
  }

  console.warn(`Giving up on "${title}" after all attempts.`);
  return null;
}

function classify(animeData) {
  if (!animeData || !animeData.raw) return { demographic: "Unclassified", genres: ["Other"] };
  
  const rawData = animeData.raw;
  const demoNames = (rawData.demographics || []).map(d => d.name);
  const demographic = demoNames.map(n => DEMOGRAPHIC_MAP[n]).find(Boolean) || "Unclassified";

  const rawTags = [
    ...(rawData.genres || []),
    ...(rawData.explicit_genres || []),
    ...(rawData.themes || [])
  ].map(g => g.name);

  const genres = [...new Set(rawTags.map(n => GENRE_MAP[n]).filter(Boolean))];
  if (genres.length === 0) genres.push("Other");

  return { demographic, genres };
}

function buildSkeletonCard(id, title) {
  const card = document.createElement('div');
  card.className = 'media-card';
  card.id = id;
  card.innerHTML = `
    <div class="cover-wrap skeleton"></div>
    <p class="media-title">${title}</p>
  `;
  return card;
}

// ---------------- ALL VIEW ----------------
let allViewLoaded = false;
let allViewLoadingPromise = null;

function setupAllView() {
  const titles = allTitles.slice(0, 30);
  const grid = document.getElementById('allGrid');
  grid.innerHTML = '';
  titles.forEach((title, i) => grid.appendChild(buildSkeletonCard(`all-card-${i}`, title)));
  return titles;
}

async function loadAllViewCovers(titles) {
  if (allViewLoaded) return;
  allViewLoaded = true;

  for (let i = 0; i < titles.length; i++) {
    const data = await fetchAnimeData(titles[i]);
    const card = document.getElementById(`all-card-${i}`);
    if (card) {
      const coverWrap = card.querySelector('.cover-wrap');
      coverWrap.classList.remove('skeleton');
      if (data && data.imageUrl) {
        coverWrap.innerHTML = `<img src="${data.imageUrl}" alt="${titles[i]}" loading="lazy" onerror="this.parentNode.innerHTML='<span style=\\'font-size:0.75rem; color:#888;\\'>No Cover</span>'">`;
      } else {
        coverWrap.innerHTML = `<span style="font-size:0.75rem; color:#888;">No Cover</span>`;
      }
    }
    sendHeight();
    // Increased gap between requests to prevent 504s
    await delay(750);
  }
}

// ---------------- DEMOGRAPHIC / GENRE VIEW ----------------
const DEMOGRAPHIC_ORDER = ["Shounen", "Shoujo", "Seinen", "Josei", "Kodomomuke", "Unclassified"];
const demoSections = {};
let demoViewStarted = false;

function slug(str) {
  return str.toLowerCase().replace(/[^a-z0-9]/g, '-');
}

function getOrCreateDemoSection(demographic) {
  if (demoSections[demographic]) return demoSections[demographic];

  const container = document.getElementById('demoContainer');
  const section = document.createElement('div');
  section.className = 'demo-section';
  section.id = `demo-${slug(demographic)}`;
  section.innerHTML = `<h2 class="demo-title">${demographic}</h2>`;
  container.appendChild(section);

  const nav = document.getElementById('demoNav');
  const navLink = document.createElement('a');
  navLink.href = `#demo-${slug(demographic)}`;
  navLink.textContent = demographic;
  const existingLinks = Array.from(nav.children);
  const insertBefore = existingLinks.find(el =>
    DEMOGRAPHIC_ORDER.indexOf(el.textContent) > DEMOGRAPHIC_ORDER.indexOf(demographic)
  );
  nav.insertBefore(navLink, insertBefore || null);

  demoSections[demographic] = { __section: section, __genres: {} };
  return demoSections[demographic];
}

function getOrCreateGenreGrid(demographic, genre) {
  const demoEntry = getOrCreateDemoSection(demographic);
  if (demoEntry.__genres[genre]) return demoEntry.__genres[genre];

  const sub = document.createElement('div');
  sub.className = 'genre-subsection';
  sub.innerHTML = `<h3 class="genre-subtitle">${genre}</h3><div class="media-grid"></div>`;
  demoEntry.__section.appendChild(sub);

  const grid = sub.querySelector('.media-grid');
  demoEntry.__genres[genre] = grid;
  return grid;
}

async function runDemoClassification() {
  if (demoViewStarted) return;
  demoViewStarted = true;

  const progress = document.getElementById('classifyProgress');
  if (allViewLoadingPromise) {
    progress.textContent = `Waiting for initial covers to finish loading…`;
    await allViewLoadingPromise;
  }

  for (let i = 0; i < allTitles.length; i++) {
    const title = allTitles[i];
    progress.textContent = `Classifying ${i + 1} / ${allTitles.length}: "${title}"…`;

    const data = await fetchAnimeData(title);
    if (data && data.imageUrl) {
      const { demographic, genres } = classify(data);
      const imgHtml = `<img src="${data.imageUrl}" alt="${title}" loading="lazy" onerror="this.parentNode.innerHTML='<span style=\\'font-size:0.75rem; color:#888;\\'>No Cover</span>'">`;

      genres.forEach(genre => {
        const grid = getOrCreateGenreGrid(demographic, genre);
        const card = document.createElement('div');
        card.className = 'media-card';
        card.innerHTML = `<div class="cover-wrap">${imgHtml}</div><p class="media-title">${title}</p>`;
        grid.appendChild(card);
      });
    }

    sendHeight();
    // Safe delay to maintain stable connection
    await delay(750);
  }

  progress.textContent = `Classified ${allTitles.length} titles.`;
  sendHeight();
}

// ---------------- VIEW TOGGLE ----------------
const allViewBtn = document.getElementById('view-all-btn');
const demoViewBtn = document.getElementById('view-demo-btn');
const allViewEl = document.getElementById('allView');
const demoViewEl = document.getElementById('demoView');

allViewBtn.addEventListener('click', () => {
  allViewBtn.classList.add('active');
  demoViewBtn.classList.remove('active');
  allViewEl.classList.remove('hidden');
  demoViewEl.classList.add('hidden');
  sendHeight();
});

demoViewBtn.addEventListener('click', () => {
  demoViewBtn.classList.add('active');
  allViewBtn.classList.remove('active');
  demoViewEl.classList.remove('hidden');
  allViewEl.classList.add('hidden');
  runDemoClassification();
  sendHeight();
});

// Initialize Page
const initialTitles = setupAllView();
sendHeight();
allViewLoadingPromise = loadAllViewCovers(initialTitles);
window.addEventListener("resize", sendHeight);
    const initialTitles = setupAllView();
    sendHeight();
    const allViewLoadingPromise = loadAllViewCovers(initialTitles);
    window.addEventListener("resize", sendHeight);
  </script>
