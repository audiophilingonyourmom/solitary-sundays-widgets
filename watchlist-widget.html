<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Watchlist</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #bb86fc;
      --border-color: #333;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      margin: 0;
    }

    .page-title {
      text-align: center;
      font-family: "Caveat", cursive;
      font-size: 3rem;
      margin: 10px 0 20px;
      color: #ffffff;
    }

    .view-toggle {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .view-toggle button {
      background: #1a1a1a;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .view-toggle button.active {
      background: var(--accent-color);
      color: #121212;
      border-color: var(--accent-color);
    }

    .demo-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 1000px;
      margin: 20px auto 30px;
      padding: 15px;
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      position: sticky;
      top: 10px;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .demo-nav a {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 4px;
      background: #252525;
      transition: background 0.2s, color 0.2s;
    }
    .demo-nav a:hover { background: var(--accent-color); color: #121212; }

    .demo-section {
      max-width: 1100px;
      margin: 0 auto 60px;
    }
    .demo-title {
      font-size: 1.8rem;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .genre-subsection { margin-bottom: 30px; }
    .genre-subtitle {
      font-size: 1.1rem;
      color: var(--accent-color);
      margin-bottom: 12px;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px;
    }
    .media-grid.fixed-six {
      grid-template-columns: repeat(6, 1fr);
      max-width: 1100px;
      margin: 0 auto;
    }
    @media (max-width: 900px) { .media-grid.fixed-six { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 500px) { .media-grid.fixed-six { grid-template-columns: repeat(2, 1fr); } }

    .media-card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease;
    }
    .media-card:hover { transform: translateY(-4px); }

    .cover-wrap {
      width: 100%;
      aspect-ratio: 2 / 3;
      background-color: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .media-card img { width: 100%; height: 100%; object-fit: cover; }

    .media-title {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 8px;
      text-align: center;
      margin: 0;
      line-height: 1.2;
    }

    .skeleton {
      background: linear-gradient(90deg, #2a2a2a 25%, #3a3a3a 50%, #2a2a2a 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .classify-progress {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 20px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h1 class="page-title">My Watchlist</h1>

  <div class="view-toggle">
    <button id="view-all-btn" class="active">All</button>
    <button id="view-demo-btn">By Demographic / Genre</button>
  </div>

  <!-- DEFAULT VIEW: first 30 titles, 6-column grid -->
  <div id="allView">
    <div class="media-grid fixed-six" id="allGrid"></div>
  </div>

  <!-- DEMOGRAPHIC/GENRE VIEW: built dynamically from live classification -->
  <div id="demoView" class="hidden">
    <p class="classify-progress" id="classifyProgress"></p>
    <div class="demo-nav" id="demoNav"></div>
    <div id="demoContainer"></div>
  </div>

  <script>
    // Master title list -- flattened, since real classification now
    // comes from MyAnimeList's own demographic/genre/theme data per
    // title rather than these old manual buckets. Paste your full
    // original list of titles here as a flat array.
    const allTitles = [
      "3x3 Eyes", "86", "91 Days", "Cowboy Bebop", "Fullmetal Alchemist Brotherhood",
      "Fruits Basket", "Toradora!", "Your Lie in April", "Sailor Moon",
      "Berserk", "Vinland Saga", "Monster", "Perfect Blue", "Paranoia Agent"
      // NOTE: trimmed for brevity in this message -- replace this
      // array with your complete original title list (flattened from
      // all five old genre buckets into one array of strings).
    ];

    const delay = ms => new Promise(res => setTimeout(res, ms));

    function sendHeight() {
      const height = document.documentElement.scrollHeight;
      window.parent.postMessage({ type: "solitary-widget-resize", widget: "watchlist", height }, "*");
    }

    // ---------------- Jikan fetch + classification ----------------

    // Your approved genre buckets, and how MAL's actual field names
    // (genres / explicit_genres / themes) map onto them.
    const GENRE_MAP = {
      "Action": "Action",
      "Romance": "Romance",
      "Comedy": "Comedy",
      "Drama": "Drama",
      "Horror": "Horror",
      "Suspense": "Thriller",
      "Sci-Fi": "Sci-Fi/Supernatural/Fantasy",
      "Supernatural": "Sci-Fi/Supernatural/Fantasy",
      "Fantasy": "Sci-Fi/Supernatural/Fantasy",
      "Slice of Life": "Slice of Life",
      "Adventure": "Adventure",
      "Mystery": "Mystery",
      "Ecchi": "Ecchi",              // comes from explicit_genres
      "Mecha": "Mecha",              // comes from themes
      "Music": "Music",              // comes from themes
      "Psychological": "Psychological", // comes from themes
      "Iyashikei": "Iyashikei",      // comes from themes
      "Mahou Shoujo": "Magical Girl" // comes from themes
    };

    const DEMOGRAPHIC_MAP = {
      "Shounen": "Shounen",
      "Shoujo": "Shoujo",
      "Seinen": "Seinen",
      "Josei": "Josei",
      "Kids": "Kodomomuke"
    };

    async function fetchAnimeData(title, retries = 3) {
      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(title)}&limit=1`);
          if (res.status === 429 || res.status === 504) {
            // Rate-limited or Jikan's server is overloaded -- back off
            // longer each retry rather than hammering it again immediately.
            await delay(1200 * (attempt + 1));
            continue;
          }
          if (!res.ok) return null;
          const data = await res.json();
          if (data.data && data.data.length > 0) return data.data[0];
          return null;
        } catch (err) {
          console.error(`Failed fetching ${title} (attempt ${attempt + 1})`, err);
          await delay(1200 * (attempt + 1));
        }
      }
      console.warn(`Giving up on ${title} after ${retries + 1} attempts`);
      return null;
    }

    function classify(animeData) {
      const demoNames = (animeData.demographics || []).map(d => d.name);
      const demographic = demoNames.map(n => DEMOGRAPHIC_MAP[n]).find(Boolean) || "Unclassified";

      const rawTags = [
        ...(animeData.genres || []),
        ...(animeData.explicit_genres || []),
        ...(animeData.themes || [])
      ].map(g => g.name);

      const genres = [...new Set(rawTags.map(n => GENRE_MAP[n]).filter(Boolean))];
      if (genres.length === 0) genres.push("Other");

      return { demographic, genres };
    }

    function buildSkeletonCard(id, title) {
      const card = document.createElement('div');
      card.className = 'media-card';
      card.id = id;
      card.innerHTML = `
        <div class="cover-wrap skeleton"></div>
        <p class="media-title">${title}</p>
      `;
      return card;
    }

    // ---------------- ALL VIEW (first 30, 6x5 grid) ----------------
    let allViewLoaded = false;

    function setupAllView() {
      const titles = allTitles.slice(0, 30);
      const grid = document.getElementById('allGrid');
      titles.forEach((title, i) => grid.appendChild(buildSkeletonCard(`all-card-${i}`, title)));
      return titles;
    }

    async function loadAllViewCovers(titles) {
      if (allViewLoaded) return;
      allViewLoaded = true;
      for (let i = 0; i < titles.length; i++) {
        const data = await fetchAnimeData(titles[i]);
        const card = document.getElementById(`all-card-${i}`);
        if (card) {
          const imgHtml = data
            ? `<img src="${data.images.jpg.image_url}" alt="${titles[i]}" loading="lazy">`
            : `<span style="font-size:0.75rem; color:#888;">No Cover</span>`;
          card.querySelector('.cover-wrap').classList.remove('skeleton');
          card.querySelector('.cover-wrap').innerHTML = imgHtml;
        }
        sendHeight();
        await delay(450);
      }
    }

    // ---------------- DEMOGRAPHIC / GENRE VIEW ----------------
    const DEMOGRAPHIC_ORDER = ["Shounen", "Shoujo", "Seinen", "Josei", "Kodomomuke", "Unclassified"];
    const demoSections = {}; // { demographic: { genre: gridElement } }
    let demoViewStarted = false;

    function slug(str) {
      return str.toLowerCase().replace(/[^a-z0-9]/g, '-');
    }

    function getOrCreateDemoSection(demographic) {
      if (demoSections[demographic]) return demoSections[demographic];

      const container = document.getElementById('demoContainer');
      const section = document.createElement('div');
      section.className = 'demo-section';
      section.id = `demo-${slug(demographic)}`;
      section.innerHTML = `<h2 class="demo-title">${demographic}</h2>`;
      container.appendChild(section);

      // Insert into nav in fixed demographic order
      const nav = document.getElementById('demoNav');
      const navLink = document.createElement('a');
      navLink.href = `#demo-${slug(demographic)}`;
      navLink.textContent = demographic;
      const existingLinks = Array.from(nav.children);
      const insertBefore = existingLinks.find(el =>
        DEMOGRAPHIC_ORDER.indexOf(el.textContent) > DEMOGRAPHIC_ORDER.indexOf(demographic)
      );
      nav.insertBefore(navLink, insertBefore || null);

      demoSections[demographic] = { __section: section, __genres: {} };
      return demoSections[demographic];
    }

    function getOrCreateGenreGrid(demographic, genre) {
      const demoEntry = getOrCreateDemoSection(demographic);
      if (demoEntry.__genres[genre]) return demoEntry.__genres[genre];

      const sub = document.createElement('div');
      sub.className = 'genre-subsection';
      sub.innerHTML = `<h3 class="genre-subtitle">${genre}</h3><div class="media-grid"></div>`;
      demoEntry.__section.appendChild(sub);

      const grid = sub.querySelector('.media-grid');
      demoEntry.__genres[genre] = grid;
      return grid;
    }

    async function runDemoClassification() {
      if (demoViewStarted) return;
      demoViewStarted = true;

      // Never run at the same time as the "All" view's own fetch loop --
      // that doubles the request rate against Jikan's limit and is what
      // was causing the 429/504 errors. Wait for it to finish first.
      const progress = document.getElementById('classifyProgress');
      if (allViewLoadingPromise) {
        progress.textContent = `Waiting for the All view to finish loading first…`;
        await allViewLoadingPromise;
      }

      for (let i = 0; i < allTitles.length; i++) {
        const title = allTitles[i];
        progress.textContent = `Classifying ${i + 1} / ${allTitles.length}…`;

        const data = await fetchAnimeData(title);
        if (data) {
          const { demographic, genres } = classify(data);
          const imgHtml = `<img src="${data.images.jpg.image_url}" alt="${title}" loading="lazy">`;

          genres.forEach(genre => {
            const grid = getOrCreateGenreGrid(demographic, genre);
            const card = document.createElement('div');
            card.className = 'media-card';
            card.innerHTML = `<div class="cover-wrap">${imgHtml}</div><p class="media-title">${title}</p>`;
            grid.appendChild(card);
          });
        }

        sendHeight();
        await delay(450);
      }

      progress.textContent = `Classified ${allTitles.length} titles.`;
      sendHeight();
    }

    // ---------------- VIEW TOGGLE ----------------
    const allViewBtn = document.getElementById('view-all-btn');
    const demoViewBtn = document.getElementById('view-demo-btn');
    const allViewEl = document.getElementById('allView');
    const demoViewEl = document.getElementById('demoView');

    allViewBtn.addEventListener('click', () => {
      allViewBtn.classList.add('active');
      demoViewBtn.classList.remove('active');
      allViewEl.classList.remove('hidden');
      demoViewEl.classList.add('hidden');
      sendHeight();
    });

    demoViewBtn.addEventListener('click', () => {
      demoViewBtn.classList.add('active');
      allViewBtn.classList.remove('active');
      demoViewEl.classList.remove('hidden');
      allViewEl.classList.add('hidden');
      runDemoClassification();
      sendHeight();
    });

    // Initialize
    const initialTitles = setupAllView();
    sendHeight();
    const allViewLoadingPromise = loadAllViewCovers(initialTitles);
    window.addEventListener("resize", sendHeight);
  </script>
</body>
</html>
