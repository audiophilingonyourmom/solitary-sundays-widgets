<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solitary Sundays — Admin</title>
<style>
  @font-face {
    font-family: "BitMGothic";
    src: url("fonts/BitMGothic.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: "PixelArial11";
    src: url("fonts/PIXEAB_.TTF") format("truetype");
    font-weight: normal;
    font-style: normal;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PixelArial11", sans-serif;
    font-size: 13px;
    color: #f0f0f0;
    background: #050717;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 20px;
  }

  .admin-card {
    width: 100%;
    max-width: 570px;
    background: rgba(10, 15, 25, 0.9);
    border: 1px solid #BAB2A5;
    border-radius: 8px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
    padding: 28px 32px 32px;
    margin-bottom: 24px;
  }

  .admin-card h2 {
    font-family: "BitMGothic", serif;
    font-size: 22px;
    font-weight: normal;
    text-align: center;
    color: #D4B9B2;
    text-shadow:
      -1px -1px 0 #060913,
       1px -1px 0 #060913,
      -1px  1px 0 #060913,
       1px  1px 0 #060913;
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 12px;
    color: #cfd6e0;
    margin: 12px 0 6px;
  }

  textarea, input[type="text"], input[type="password"] {
    width: 100%;
    background: #0d1424;
    border: 1px solid #A8C4D4;
    border-radius: 4px;
    color: #f0f0f0;
    font-family: "PixelArial11", sans-serif;
    font-size: 13px;
    padding: 10px 12px;
  }

  textarea::placeholder, input::placeholder {
    color: #6d7686;
  }

  textarea {
    min-height: 110px;
    resize: vertical;
  }

  button {
    width: 100%;
    margin-top: 18px;
    padding: 10px;
    font-family: "BitMGothic", serif;
    font-size: 15px;
    font-weight: normal;
    background: #8C5F68;
    border: 1px solid #BFB9B1;
    border-radius: 4px;
    color: #ffffff;
    cursor: pointer;
  }

  button:hover { background: #9f6c76; }
  button:disabled { opacity: 0.5; cursor: default; }

  .status-msg {
    font-size: 12px;
    margin-top: 10px;
    text-align: center;
    min-height: 14px;
  }
  .status-msg.error { color: #e39a9a; }
  .status-msg.success { color: #9adca0; }

  #app { display: none; }

  .status-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 16px;
  }
  @media (max-width: 520px) {
    .status-fields { grid-template-columns: 1fr; }
  }

  #signout {
    background: transparent;
    border: 1px solid #6d7686;
    color: #cfd6e0;
    font-family: "PixelArial11", sans-serif;
    font-size: 11px;
    width: auto;
    padding: 4px 10px;
    margin: 0 0 20px;
    float: right;
  }
  #signout:hover { background: rgba(255,255,255,0.05); }
</style>
</head>
<body>

  <div class="admin-card" id="login-card">
    <h2>✦ Admin Login ✦</h2>
    <label for="secret-key">Admin Secret Key</label>
    <input type="password" id="secret-key" placeholder="Enter your key">
    <button id="login-btn">Unlock</button>
    <p class="status-msg error" id="login-msg"></p>
  </div>

  <div id="app">
    <button id="signout">Log out</button>

    <div class="admin-card">
      <h2>✦ New Microblog Post ✦</h2>
      <label for="post-text">Post</label>
      <textarea id="post-text" placeholder="Write something..."></textarea>
      <label for="avatar-url">Image URL (optional)</label>
      <input type="text" id="avatar-url" placeholder="Leave blank to use the default avatar">
      <button id="post-btn">Publish Post</button>
      <p class="status-msg" id="post-msg"></p>
    </div>

    <div class="admin-card">
      <h2>✦ Currently ✦</h2>
      <div class="status-fields">
        <div>
          <label for="feeling">Feeling</label>
          <input type="text" id="feeling">
        </div>
        <div>
          <label for="listening">Listening</label>
          <input type="text" id="listening">
        </div>
        <div>
          <label for="watching">Watching</label>
          <input type="text" id="watching">
        </div>
        <div>
          <label for="playing">Playing</label>
          <input type="text" id="playing">
        </div>
        <div>
          <label for="reading">Reading</label>
          <input type="text" id="reading">
        </div>
      </div>
      <button id="status-btn">Save Status</button>
      <p class="status-msg" id="status-msg"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ---- Fill these in with your Supabase project's values ----
    const SUPABASE_URL = "https://gcnmjgyuyelqppkpytow.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_6SJRQVPqERtYanyHi7iGxw_NGIwVoWN";
    // The email tied to the one Supabase Auth user you created for
    // yourself. The visible form only asks for the password (styled
    // as "Admin Secret Key") — the email stays fixed here so you
    // never have to type it.
    const ADMIN_EMAIL = "felixnikkole@gmail.com";
    // -------------------------------------------------------------

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginCard = document.getElementById("login-card");
    const appDiv = document.getElementById("app");

    async function checkSession() {
      const { data } = await supabaseClient.auth.getSession();
      if (data.session) {
        loginCard.style.display = "none";
        appDiv.style.display = "block";
        loadCurrentStatus();
      } else {
        loginCard.style.display = "block";
        appDiv.style.display = "none";
      }
    }

document.getElementById("login-btn").addEventListener("click", async () => {
      const key = document.getElementById("secret-key").value;
      const msg = document.getElementById("login-msg");
      msg.textContent = "";

      console.log("Attempting login with email:", JSON.stringify(ADMIN_EMAIL));
      console.log("Password length:", key.length, "First char code:", key.charCodeAt(0), "Last char code:", key.charCodeAt(key.length - 1));

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: ADMIN_EMAIL,
        password: key,
      });

if (error) {
        console.error("Login error:", error);
        msg.textContent = error.message;
      } else {
        checkSession();
      }
    });

    document.getElementById("signout").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      checkSession();
    });

    document.getElementById("post-btn").addEventListener("click", async () => {
      const text = document.getElementById("post-text").value.trim();
      const avatarUrl = document.getElementById("avatar-url").value.trim();
      const msg = document.getElementById("post-msg");
      msg.className = "status-msg";
      msg.textContent = "";

      if (!text) {
        msg.textContent = "Write something first.";
        msg.classList.add("error");
        return;
      }

      const { error } = await supabaseClient.from("microblog_posts").insert({
        post_text: text,
        avatar_url: avatarUrl || null,
      });

      if (error) {
        msg.textContent = error.message;
        msg.classList.add("error");
      } else {
        msg.textContent = "Posted!";
        msg.classList.add("success");
        document.getElementById("post-text").value = "";
        document.getElementById("avatar-url").value = "";
      }
    });

    async function loadCurrentStatus() {
      const { data } = await supabaseClient.from("status_widget").select("*").eq("id", 1).single();
      if (!data) return;
      document.getElementById("feeling").value = data.feeling || "";
      document.getElementById("listening").value = data.listening || "";
      document.getElementById("watching").value = data.watching || "";
      document.getElementById("playing").value = data.playing || "";
      document.getElementById("reading").value = data.reading || "";
    }

    document.getElementById("status-btn").addEventListener("click", async () => {
      const msg = document.getElementById("status-msg");
      msg.className = "status-msg";
      msg.textContent = "";

      const { error } = await supabaseClient.from("status_widget").update({
        feeling: document.getElementById("feeling").value.trim(),
        listening: document.getElementById("listening").value.trim(),
        watching: document.getElementById("watching").value.trim(),
        playing: document.getElementById("playing").value.trim(),
        reading: document.getElementById("reading").value.trim(),
        updated_at: new Date().toISOString(),
      }).eq("id", 1);

      if (error) {
        msg.textContent = error.message;
        msg.classList.add("error");
      } else {
        msg.textContent = "Saved!";
        msg.classList.add("success");
      }
    });

    checkSession();
  </script>
</body>
</html>
